<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>무한매수법 V4.0 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root {
    --bg: #0f1420;
    --card-bg: #1a2233;
    --card-border: #2a3550;
    --text: #e8ecf4;
    --text-dim: #8a96b3;
    --green: #3ecf8e;
    --red: #ef5b6f;
    --blue: #5b9dff;
    --amber: #f0b846;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .subtitle { color: var(--text-dim); font-size: 13px; margin-bottom: 24px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .card .label { color: var(--text-dim); font-size: 12px; margin-bottom: 6px; }
  .card .value { font-size: 22px; font-weight: 600; }
  .card .sub { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
  .pos { color: var(--green); }
  .neg { color: var(--red); }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge-normal { background: rgba(62,207,142,0.15); color: var(--green); }
  .badge-reverse { background: rgba(239,91,111,0.15); color: var(--red); }
  section { margin-bottom: 28px; }
  section > h2 { font-size: 15px; margin: 0 0 12px; color: var(--text-dim); font-weight: 600; letter-spacing: 0.02em; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--card-border); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--text-dim); font-weight: 500; }
  .side-buy { color: var(--blue); }
  .side-sell { color: var(--amber); }
  .chart-wrap { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 16px; height: 260px; }
  .empty { color: var(--text-dim); font-size: 13px; padding: 20px 0; }
  .note { color: var(--text-dim); font-size: 12px; margin-top: 10px; }
</style>
</head>
<body>

<h1>무한매수법 V4.0 대시보드</h1>
<div class="subtitle" id="last-updated">불러오는 중...</div>

<section id="summary-section">
  <h2>계좌 요약</h2>
  <div class="grid" id="summary-cards"></div>
</section>

<section id="cycle-section">
  <h2>현재 사이클</h2>
  <div class="grid" id="cycle-cards"></div>
</section>

<section id="today-orders-section">
  <h2>오늘의 주문 현황</h2>
  <div id="today-orders-wrap"></div>
  <div class="note">
    "체결 대기 중"은 오늘 제출됐지만 아직 체결이 확인되지 않은 주문입니다(다음 갱신에서 체결로
    바뀌거나, 장 마감까지 안 되면 미체결로 남습니다). "미끼주문"은 실제 체결 목적이 아니라
    증권사 주문가 제한을 우회하기 위한 장치입니다. 대기 중이던 주문이 체결되지 않으면 다음날
    아래 "최근 취소된 주문" 목록으로 옮겨집니다.
  </div>
</section>

<section id="cancelled-orders-section">
  <h2>최근 취소된 주문 (최대 20건)</h2>
  <div id="cancelled-orders-wrap"></div>
</section>

<section id="trades-section">
  <h2>최근 거래 (최대 20건)</h2>
  <div id="trades-table-wrap"></div>
</section>

<section id="history-section">
  <h2>사이클별 수익률</h2>
  <div class="chart-wrap"><canvas id="cycle-chart"></canvas></div>
</section>

<script>
const REFRESH_INTERVAL_MS = 60000; // 설계도 12-1번: "최소 몇 분 간격으로 자동 갱신" -> 60초 폴링
let chart = null;

function fmtMoney(v) {
  if (v === null || v === undefined) return "-";
  return "$" + v.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtPct(v) {
  if (v === null || v === undefined) return "-";
  const sign = v > 0 ? "+" : "";
  return `${sign}${v.toFixed(2)}%`;
}
function pctClass(v) {
  if (v === null || v === undefined) return "";
  return v > 0 ? "pos" : v < 0 ? "neg" : "";
}
function fmtNum(v, digits = 4) {
  if (v === null || v === undefined) return "-";
  return v.toFixed(digits).replace(/\.?0+$/, "") || "0";
}

// 로그를 볼 수 없는 사람도 주문 유형을 알아볼 수 있도록, DB의 내부 코드(purpose/order_type)를
// 한글로 바꿔 보여줍니다. 매핑에 없는 코드는 원본 코드를 그대로 보여줍니다.
const PURPOSE_LABELS = {
  FIRST: "첫매수",
  HALF_STAR: "전반전 별지점 매수",
  HALF_AVG: "전반전 평단가 매수",
  FULL_STAR: "후반전 별지점 매수",
  REVERSE: "리버스모드 매수",
  QUARTER: "쿼터매도",
  LIMIT_15PCT: "지정가매도(+15%)",
  REVERSE_MOC: "리버스모드 매도(MOC)",
  REVERSE_LOC: "리버스모드 매도(LOC)",
};
function purposeLabel(code) {
  return PURPOSE_LABELS[code] || code;
}

function card(label, value, sub, valueClass) {
  return `<div class="card">
    <div class="label">${label}</div>
    <div class="value ${valueClass || ""}">${value}</div>
    ${sub ? `<div class="sub">${sub}</div>` : ""}
  </div>`;
}

function renderSummary(portfolio) {
  const el = document.getElementById("summary-cards");
  if (!portfolio) {
    el.innerHTML = `<div class="empty">아직 시작 전입니다. bootstrap.py를 실행해 무한매수법을 시작하세요.</div>`;
    return;
  }
  el.innerHTML = [
    card("총평가금액", fmtMoney(portfolio.total_equity),
      `원금 ${fmtMoney(portfolio.initial_principal)} 대비`),
    card("총수익률 (실현+미실현)", fmtPct(portfolio.total_return_pct), null, pctClass(portfolio.total_return_pct)),
    card("실현 수익금", fmtMoney(portfolio.total_realized_profit),
      fmtPct(portfolio.total_realized_return_pct), pctClass(portfolio.total_realized_return_pct)),
    card("평가(미실현) 손익", fmtMoney(portfolio.current_unrealized_pnl),
      fmtPct(portfolio.current_unrealized_return_pct), pctClass(portfolio.current_unrealized_return_pct)),
    card("완료된 사이클", `${portfolio.completed_cycles}회`, `전략 시작일 ${portfolio.strategy_start_date}`),
  ].join("");
}

function renderCycle(cycle) {
  const el = document.getElementById("cycle-cards");
  if (!cycle) {
    el.innerHTML = `<div class="empty">진행 중인 사이클이 없습니다.</div>`;
    return;
  }
  const badge = cycle.mode === "REVERSE"
    ? `<span class="badge badge-reverse">&#128308; 리버스모드</span>`
    : `<span class="badge badge-normal">&#128994; 일반모드${cycle.phase ? " · " + cycle.phase : ""}</span>`;

  const cards = [
    card("모드", badge, `사이클 #${cycle.cycle_id} · ${cycle.elapsed_days}일 경과 (시작 ${cycle.start_date})`),
    card("T값 / 분할수", `${fmtNum(cycle.t)} / ${cycle.split_count}`),
    card("평단가 / 현재가", `${fmtMoney(cycle.avg_price)} / ${fmtMoney(cycle.current_price)}`,
      "현재가는 최근 체결 시점 스냅샷(실시간 아님)"),
    card("보유수량", `${cycle.holding_qty}주`, `잔금 ${fmtMoney(cycle.remaining_cash)}`),
    card("다음 매수 목표가", fmtMoney(cycle.next_buy_price)),
    card("다음 매도 목표가", fmtMoney(cycle.next_sell_price)),
  ];
  el.innerHTML = cards.join("") + (cycle.note ? `<div class="note" style="grid-column:1/-1">${cycle.note}</div>` : "");
}

function renderTrades(trades) {
  const wrap = document.getElementById("trades-table-wrap");
  if (!trades || trades.length === 0) {
    wrap.innerHTML = `<div class="empty">거래 내역이 없습니다.</div>`;
    return;
  }
  const rows = trades.map(t => `
    <tr>
      <td>${t.date}</td>
      <td class="${t.side === 'BUY' ? 'side-buy' : 'side-sell'}">${t.side === 'BUY' ? '매수' : '매도'}</td>
      <td>${fmtMoney(t.price)}</td>
      <td>${t.qty}</td>
      <td>${purposeLabel(t.order_type)}</td>
      <td>${t.profit_amount !== null ? fmtMoney(t.profit_amount) : '-'}</td>
      <td class="${pctClass(t.return_pct)}">${t.return_pct !== null ? fmtPct(t.return_pct) : '-'}</td>
    </tr>`).join("");
  wrap.innerHTML = `<table>
    <thead><tr><th>날짜</th><th>구분</th><th>가격</th><th>수량</th><th>유형</th><th>수익금</th><th>수익률</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function renderTodayOrders(todayOrders) {
  const wrap = document.getElementById("today-orders-wrap");
  if (!todayOrders || (todayOrders.filled.length === 0 && todayOrders.pending.length === 0)) {
    wrap.innerHTML = `<div class="empty">오늘 제출된 주문이 아직 없습니다.</div>`;
    return;
  }

  let html = "";

  if (todayOrders.filled.length > 0) {
    const rows = todayOrders.filled.map(t => `
      <tr>
        <td class="${t.side === 'BUY' ? 'side-buy' : 'side-sell'}">${t.side === 'BUY' ? '매수' : '매도'}</td>
        <td>${purposeLabel(t.order_type)}</td>
        <td>${fmtMoney(t.price)}</td>
        <td>${t.qty}</td>
        <td>${t.profit_amount !== null ? fmtMoney(t.profit_amount) : '-'}</td>
        <td class="${pctClass(t.return_pct)}">${t.return_pct !== null ? fmtPct(t.return_pct) : '-'}</td>
      </tr>`).join("");
    html += `<div class="sub" style="margin-bottom:6px;">&#9989; 체결완료 (${todayOrders.filled.length}건)</div>
      <table>
        <thead><tr><th>구분</th><th>유형</th><th>체결가</th><th>수량</th><th>수익금</th><th>수익률</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  if (todayOrders.pending.length > 0) {
    const rows = todayOrders.pending.map(o => `
      <tr>
        <td class="${o.side === 'BUY' ? 'side-buy' : 'side-sell'}">${o.side === 'BUY' ? '매수' : '매도'}</td>
        <td>${purposeLabel(o.purpose)}${o.is_decoy ? ' <span class="badge" style="background:rgba(240,184,70,0.15);color:var(--amber);">미끼주문</span>' : ''}</td>
        <td>${o.order_kind}</td>
        <td>${o.price !== null ? fmtMoney(o.price) : '시장가'}</td>
        <td>${o.qty}</td>
      </tr>`).join("");
    html += `<div class="sub" style="margin:${todayOrders.filled.length ? '16px' : '0'} 0 6px;">&#9203; 체결 대기 중 (${todayOrders.pending.length}건)</div>
      <table>
        <thead><tr><th>구분</th><th>유형</th><th>주문방식</th><th>주문가</th><th>수량</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  wrap.innerHTML = html;
}

function renderCancelledOrders(cancelledOrders) {
  const wrap = document.getElementById("cancelled-orders-wrap");
  if (!cancelledOrders || cancelledOrders.length === 0) {
    wrap.innerHTML = `<div class="empty">취소된 주문 이력이 없습니다.</div>`;
    return;
  }
  const rows = cancelledOrders.map(o => `
    <tr>
      <td>${o.submitted_date}</td>
      <td>${o.cancelled_date}</td>
      <td class="${o.side === 'BUY' ? 'side-buy' : 'side-sell'}">${o.side === 'BUY' ? '매수' : '매도'}</td>
      <td>${purposeLabel(o.purpose)}${o.is_decoy ? ' <span class="badge" style="background:rgba(240,184,70,0.15);color:var(--amber);">미끼주문</span>' : ''}</td>
      <td>${o.order_kind}</td>
      <td>${o.price !== null ? fmtMoney(o.price) : '시장가'}</td>
      <td>${o.qty}</td>
    </tr>`).join("");
  wrap.innerHTML = `<table>
    <thead><tr><th>제출일</th><th>취소확인일</th><th>구분</th><th>유형</th><th>주문방식</th><th>주문가</th><th>수량</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function renderCycleChart(history) {
  const canvas = document.getElementById("cycle-chart");
  if (!history || history.length === 0) {
    canvas.parentElement.innerHTML = `<div class="empty">아직 완료된 사이클이 없습니다.</div>`;
    return;
  }
  const labels = history.map(h => `#${h.cycle_id}`);
  const data = history.map(h => h.cycle_return_pct);
  const colors = data.map(v => (v >= 0 ? "#3ecf8e" : "#ef5b6f"));

  if (chart) chart.destroy();
  chart = new Chart(canvas, {
    type: "bar",
    data: {
      labels,
      datasets: [{ label: "사이클 수익률(%)", data, backgroundColor: colors }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: "#8a96b3" }, grid: { color: "#2a3550" } },
        y: { ticks: { color: "#8a96b3" }, grid: { color: "#2a3550" } },
      },
    },
  });
}

async function refresh() {
  try {
    const res = await fetch("/api/dashboard");
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    renderSummary(data.portfolio);
    renderCycle(data.cycle);
    renderTodayOrders(data.today_orders);
    renderCancelledOrders(data.cancelled_orders);
    renderTrades(data.recent_trades);
    renderCycleChart(data.cycle_history);
    document.getElementById("last-updated").textContent =
      `마지막 갱신: ${new Date(data.generated_at).toLocaleString("ko-KR")} (${REFRESH_INTERVAL_MS / 1000}초마다 자동 갱신)`;
  } catch (err) {
    document.getElementById("last-updated").textContent = `데이터를 불러오지 못했습니다: ${err.message}`;
  }
}

refresh();
setInterval(refresh, REFRESH_INTERVAL_MS);
</script>

</body>
</html>
